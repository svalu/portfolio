<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>희랑 — Intro</title>
<style>
  @font-face{font-family:"Pretendard";src:url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations");
    font-weight:100 900;font-display:swap}

  /* ───────────────────────────────────────────────────────────
     인트로 4막 — "하나의 색이 자리를 잡으면, 세상이 구성되고, 색이 번진다"
       0막  빨강     화면 전체가 오브젝트 색 하나              body.act0
       1막  응축     빨강이 오브젠트 자리로 줄어들며 흑백 세상이 드러남   body.act1
       2막  등장     HEE → RANG → 점 → 마크 → 직함 → 본문 순서로     body.act2
       3막  번짐     오브젝트에서 색이 원형으로 퍼져 세상에 닿음        body.color
     클릭·휠·SKIP → 즉시 마지막 상태
     ─────────────────────────────────────────────────────────── */
  :root{
    /* 오브젝트 화면 위치 (색이 번져 나오는 중심) */
    --ox:72.5%; --oy:52.5%;
    /* 흑백 */
    --m-paper:#ffffff; --m-type:#111111; --m-dot:#c9c9c9; --m-band:#3a3a3a; --m-tri:#c2c2c2;
    --m-bottom:#050505; --m-body:#e6e6e6; --m-mark:#111111; --m-year:#ffffff;
    /* 컬러 */
    --c-type:#8a0f78; --c-band1:#3fae7a; --c-band2:#12b3b9; --c-band3:#1f8fd6;
    --c-tri:#6fc28f; --c-bottom1:#8a9a2a; --c-bottom2:#8d4a86; --c-body:#f4d54a; --c-mark:#b7a56b;
    --red:#c0203a;           /* 렌더된 오브젠트 색에 맞춘 오버레이 색 */

    --ease:cubic-bezier(.4,.05,.2,1);
    --in:cubic-bezier(.2,.7,.2,1);
    --dur:1.9s;
    --spread:2.3s;           /* 색이 오브젝트에서 퍼지는 시간 */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--m-paper);overflow:hidden}
  body{font-family:"Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;color:var(--m-type);cursor:default}

  .stage{position:fixed;inset:0;display:grid;grid-template-rows:59% 9% 32%}

  /* ── 0·1막: 빨강 오버레이. 오브젝트 위치를 중심으로 원형으로 줄어든다 ── */
  .veil{position:fixed;inset:0;background:var(--red);z-index:5;pointer-events:none;
    clip-path:circle(140% at var(--ox) var(--oy));
    transition:clip-path 1.7s cubic-bezier(.65,0,.25,1)}
  body.act1 .veil{clip-path:circle(0% at var(--ox) var(--oy))}

  /* ── 2막: 등장. 요소마다 숨김 상태 → act2 에서 순서대로 ── */
  .type small,.mark,.year,.dots i{opacity:0;transform:translateY(22px);
    transition:opacity .9s var(--in),transform 1.1s var(--in),color var(--dur) var(--ease)}
  .dots i{transform:translateY(10px)}
  body.act2 .type small,body.act2 .mark,body.act2 .year,body.act2 .dots i{opacity:1;transform:none}
  body.act2 .type small:nth-child(1){transition-delay:0s,0s,var(--cd,0s)}
  body.act2 .type small:nth-child(2){transition-delay:.28s,.28s,var(--cd,0s)}
  body.act2 .mark{transition-delay:.95s,.95s,var(--cd,0s)}
  body.act2 .year{transition-delay:1.1s,1.1s,var(--cd,0s)}
  /* 본문은 위에서 아래로 쓰이듯 드러남 */
  .body{clip-path:inset(0 0 100% 0);transition:clip-path 1.3s var(--in) 1.25s,color var(--dur) var(--ease) var(--cd,0s)}
  body.act2 .body{clip-path:inset(0 0 0 0)}

  /* 상단 점 라인 */
  .dots{position:absolute;left:27.5%;right:1.2%;top:4.6%;display:flex;justify-content:space-between;z-index:3}
  .dots i{width:.85vw;height:.85vw;min-width:8px;min-height:8px;border-radius:50%;background:var(--m-dot);
    transition:opacity .7s var(--in),transform .9s var(--in),background 1.4s var(--ease)}
  body.act2 .dots i{transition-delay:var(--ad),var(--ad),var(--cd)}     /* ad: 등장 지연, cd: 색 지연 */
  body.color .dots i{background:var(--dc)}
  body.flow .dots i{transition:none}          /* 흐름 단계: JS 가 매 프레임 색을 쓰므로 전환 제거 */

  /* 큰 타이포 */
  .type{position:absolute;left:3.4%;top:2.5%;line-height:.86;font-size:clamp(90px,17.6vw,262px);letter-spacing:-.03em;font-weight:200;
    color:var(--m-type);z-index:3;user-select:none}
  .type small{display:block}
  body.color .type small{color:var(--c-type)}
  body.color .type small{--cd:1.3s}          /* 오브젠트에서 가장 멀다 → 색이 마지막에 닿음 */

  /* 가운데 띠 + 삼각 */
  .band{grid-row:2;position:relative;background:var(--m-band);z-index:1}
  .tri{position:absolute;left:0;bottom:0;width:16%;height:155%;
    background:linear-gradient(135deg,var(--m-tri),#8a8a8a);clip-path:polygon(0 0,100% 100%,0 100%);z-index:2;overflow:hidden}
  .tri::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c-tri),#9fd7a5);
    opacity:0;transition:opacity 1.2s var(--ease) 1.5s}
  body.color .tri::after{opacity:1}
  .year{position:absolute;right:2%;bottom:6%;font-weight:300;letter-spacing:.02em;font-size:clamp(20px,3vw,46px);color:var(--m-year);z-index:3}

  /* 컬러 레이어: 오브젝트 위치에서 원형으로 퍼진다. 각 블록 안에서의 중심 좌표는 JS가 --cx/--cy 로 넣는다 */
  .band::after,.bottom::after{content:"";position:absolute;inset:0;
    clip-path:circle(0% at var(--cx,72%) var(--cy,50%));
    transition:clip-path var(--spread) var(--ease)}
  .band::after{background:linear-gradient(90deg,var(--c-band1) 0%,var(--c-band2) 55%,var(--c-band3) 100%);transition-delay:.15s}
  .bottom::after{background:linear-gradient(90deg,var(--c-bottom1) 0%,#6f7a3a 55%,var(--c-bottom2) 100%);transition-delay:.3s}
  body.color .band::after,body.color .bottom::after{clip-path:circle(160% at var(--cx,72%) var(--cy,50%))}
  .bottom .body,.band .year{position:absolute;z-index:1}

  /* 로고 마크 */
  .mark{position:absolute;right:2.2%;top:47%;width:clamp(44px,6vw,90px);color:var(--m-mark);z-index:3}
  .mark svg{width:100%;height:auto;display:block}
  body.color .mark{color:var(--c-mark);--cd:.4s}

  /* 하단 본문 블록 */
  .bottom{grid-row:3;position:relative;background:var(--m-bottom);z-index:1}
  .body{position:absolute;left:1.6%;top:8%;width:59%;font-weight:300;
    font-size:clamp(11px,.95vw,15px);line-height:2.35;letter-spacing:.01em;color:var(--m-body);text-align:justify}
  body.color .body{color:var(--c-body);--cd:1.0s}

  /* 3D 캔버스 — 오버레이(z5) 아래, 레이아웃(z1~3) 위 */
  #c{position:fixed;inset:0;z-index:4;pointer-events:none}

  /* 스크롤 힌트: 3막 끝나고 */
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;font-size:11px;letter-spacing:.28em;
    color:rgba(255,255,255,.7);opacity:0;transition:opacity 1s var(--ease) 2.4s;pointer-events:none}
  body.color .hint{opacity:1}
  .hint i{display:block;width:1px;height:22px;margin:8px auto 0;background:rgba(255,255,255,.5);animation:drop 1.6s ease-in-out infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* 즉시 완료 (스킵): 한 프레임 동안 전환 시간 0 */
  body.snap *,body.snap *::after{transition-duration:0s !important;transition-delay:0s !important}

  /* 개발용 */
  .ctl{position:fixed;left:18px;bottom:16px;z-index:9;display:flex;gap:8px;opacity:.55}
  .ctl:hover{opacity:1}
  .ctl button{font:11px/1 system-ui,sans-serif;letter-spacing:.2em;padding:8px 12px;border-radius:999px;
    border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);color:#333;cursor:pointer}

  @media (max-width:820px){
    :root{--ox:78%}
    .stage{grid-template-rows:56% 8% 36%}
    .type{font-size:clamp(70px,19vw,140px)}
    .body{width:92%;font-size:11px;line-height:2}
    .dots{left:40%}
  }
</style>
</head>
<body class="act0">
<div class="stage">
  <div class="dots" id="dots"></div>

  <div class="type" id="type">
    <small>HEE</small>
    <small>RANG</small>
  </div>

  <div class="band" id="band">
    <div class="tri"></div>
    <div class="year">.UX Engineer</div>
  </div>

  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4">
      <path d="M8 40 L50 8 L92 40"/><path d="M22 40 H78"/>
      <circle cx="50" cy="66" r="26"/><path d="M50 40 V92 M24 66 H76"/>
    </svg>
  </div>

  <div class="bottom" id="bottom">
    <p class="body" id="body">
      화면을 만들던 사람이 시스템을 만들게 됐다. 상담 화면에 창과 작업표시줄을 넣어 OS처럼 굴린 것이 2023년, 그 관점이 관리자 도구 전체로 번진 것이 2026년이다. 그 사이에 AI 여럿과 한 프로젝트를 석 달 동안 이어서 일하는 방식을 설계했고, 그 방식으로 내 말투를 배우는 로컬 모델을 키웠다. 보기 좋은 디자인과 옳은 디자인은 다르다고 믿는다. 이 포트폴리오는 그 둘 사이에서 내가 어디에 서 있는지를 순서대로 보여준다.
    </p>
  </div>
</div>

<canvas id="c"></canvas>
<div class="veil"></div>
<div class="hint">SCROLL<i></i></div>
<div class="ctl"><button id="replay">REPLAY</button><button id="skip">SKIP</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ── 점 라인: 등장은 왼→오, 색은 오브젝트(우측)에서 가까운 것부터 ── */
const dots = document.getElementById('dots');
const DOTS = 36, HUE0 = 50, HUE_SPAN = 230;               // 노랑(50°) → 빨강·자주 → 파랑 → 청록(-180°)
const dotEls = [];
const dotHue = i => HUE0 - (i/(DOTS-1))*HUE_SPAN;
for(let i=0;i<DOTS;i++){
  const d = document.createElement('i'); dotEls.push(d);
  const h = dotHue(i);
  d.style.setProperty('--dc', `hsl(${(h+360)%360} 72% 52%)`);
  d.style.setProperty('--ad', (0.55 + i*0.022)+'s');          // 등장: RANG 다음, 왼→오
  d.style.setProperty('--cd', (0.35 + (DOTS-1-i)*0.028)+'s'); // 색: 오른쪽(오브젠트 쪽)부터 왼쪽으로
  dots.appendChild(d);
}

/* 색이 퍼지는 중심을 각 블록 좌표계로 변환해 --cx/--cy 에 넣는다 */
function setSpreadCenters(){
  const ox = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ox'))/100*innerWidth;
  const oy = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--oy'))/100*innerHeight;
  for(const id of ['band','bottom']){
    const el = document.getElementById(id), r = el.getBoundingClientRect();
    el.style.setProperty('--cx', ((ox-r.left)/r.width*100).toFixed(1)+'%');
    el.style.setProperty('--cy', ((oy-r.top)/r.height*100).toFixed(1)+'%');
  }
}

/* ── 3D 오브젠트 ── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
camera.position.set(0, 0.2, 20);

const prof = [[0,-4.6],[1.0,-4.5],[1.55,-3.9],[1.65,-3.1],[1.35,-2.35],[0.85,-1.75],[0.7,-1.35],[0.95,-0.75],[1.15,-0.05],[0.95,0.55],[0.68,1.05],[0.66,1.55],[1.2,2.0],[2.15,2.35],[2.35,2.62],[2.1,2.85],[0,2.9]];
const curve = new THREE.SplineCurve(prof.map(p=>new THREE.Vector2(p[0],p[1])));
const lathe = new THREE.LatheGeometry(curve.getPoints(90), 96); lathe.computeVertexNormals();
const RED = new THREE.Color(0x9c0a18);
const mat = new THREE.MeshStandardMaterial({color:RED, roughness:.7, metalness:0});
const body = new THREE.Mesh(lathe, mat);
const ball = new THREE.Mesh(new THREE.SphereGeometry(.68, 64, 48), mat); ball.position.y = 4.15;
const group = new THREE.Group(); group.add(body, ball); scene.add(group);

scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, .55));
const key = new THREE.DirectionalLight(0xffffff, .9); key.position.set(-4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, .25); rim.position.set(5, -2, -6); scene.add(rim);

let baseScale = 1, vwWorld = 1, vhWorld = 1;
function place(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  vhWorld = 2*Math.tan(camera.fov*Math.PI/360)*camera.position.z; vwWorld = vhWorld*camera.aspect;
  baseScale = Math.min(vhWorld*0.81/9.43, vwWorld/20);
  const ox = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ox'))/100;
  group.position.x = (ox-0.5)*vwWorld;
  group.position.y = -(0.525-0.5)*vhWorld - 0.115*baseScale;
  setSpreadCenters();
}
addEventListener('resize', place); place();

/* ── 타임라인 ── */
const T = { act1:0.55, act2:2.25, color:4.05, flow:4.05+0.35+(DOTS-1)*0.028+1.4 };  // flow = 점 색 번짐이 끝나는 시점
const SHRINK = 1.7;                                   // 1막 길이 = veil 전환 시간
let t0 = performance.now()/1000, fired = {}, skipped = false, flowStart = 0;
/* 점 색 흐름: hue 가 라인을 따라 이동(초당 38°) + 밝기 파동이 지나간다 */
function flowDots(now){
  const hs = (now - flowStart)*38;
  for(let i=0;i<DOTS;i++){
    const h = (dotHue(i) + hs + 720) % 360;
    const l = 52 + 7*Math.sin((now - flowStart)*2.2 - i*.45);
    dotEls[i].style.background = `hsl(${h.toFixed(1)} 72% ${l.toFixed(1)}%)`;
  }
}
const easeIO = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const B = document.body;

function reset(){
  B.classList.add('snap');
  B.classList.remove('act1','act2','color','flow'); B.classList.add('act0');
  dotEls.forEach(d=>d.style.background='');
  fired = {}; skipped = false; t0 = performance.now()/1000;
  requestAnimationFrame(()=>requestAnimationFrame(()=>B.classList.remove('snap')));
}
function skip(){
  if(skipped) return; skipped = true;
  B.classList.add('snap','act1','act2','color','flow'); fired = {act1:1,act2:1,color:1,flow:1};
  flowStart = performance.now()/1000;
  requestAnimationFrame(()=>requestAnimationFrame(()=>B.classList.remove('snap')));
}
document.getElementById('replay').onclick = reset;
document.getElementById('skip').onclick = skip;
addEventListener('wheel', skip, {passive:true});
addEventListener('click', e=>{ if(e.target.tagName!=='BUTTON') skip(); });

/* ── 마우스 스프링 ── */
const mouse={x:0,y:0}, sm={x:0,y:0}, vel={x:0,y:0}; let spin=0;
addEventListener('pointermove', e=>{ mouse.x=e.clientX/innerWidth-.5; mouse.y=e.clientY/innerHeight-.5; });

function frame(){
  requestAnimationFrame(frame);
  const now = performance.now()/1000, t = now - t0;

  for(const k in T){ if(!fired[k] && t>=T[k]){ fired[k]=1; B.classList.add(k); if(k==='act1') B.classList.remove('act0'); if(k==='flow') flowStart = now; } }
  if(fired.flow) flowDots(now);

  // 1막: 오브젝트가 큰 상태(화면을 채우던 색)에서 제 크기로 응축. veil 원과 같은 곡선으로
  let s = skipped ? 1 : easeIO(Math.min(Math.max((t - T.act1)/SHRINK, 0), 1));
  const scale = baseScale * (1 + (1-s)*3.2);
  group.scale.setScalar(scale);

  // 마우스 반응은 응축이 끝난 뒤 서서히 들어온다
  const live = s;
  vel.x = (mouse.x - sm.x)*.085; vel.y = (mouse.y - sm.y)*.085;
  sm.x += vel.x; sm.y += vel.y;
  spin += vel.x*2.2; spin *= .965;

  group.rotation.y = now*.16 + (sm.x*1.4 + spin)*live;
  group.rotation.x = -sm.y*.42*live;
  group.rotation.z = -sm.x*.28*live;
  ball.position.x = sm.x*1.6*live;
  ball.position.z = -sm.y*1.2*live;
  ball.position.y = 4.15 + Math.sin(now*1.3)*.12 + Math.abs(sm.x)*.35*live;
  key.position.set(-4 + sm.x*14*live, 6 - sm.y*10*live, 8);
  rim.intensity = .25 + Math.abs(sm.x)*.5*live;

  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
