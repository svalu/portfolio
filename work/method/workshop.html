<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop — 자리 표시</title>
<style>
  /* 03 METHOD 의 실물 자리에 들어갈 워크샵 슬라이드 한 장 — 지금은 자리 표시(더미).
     실제 자료가 오면 이 파일을 갈아끼운다. 1440×900 고정, 부모가 축소한다 */
  @font-face{font-family:"Pretendard";src:url("../../assets/fonts/Pretendard-Light.woff2") format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Pretendard";src:url("../../assets/fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  *{box-sizing:border-box;margin:0}
  html,body{width:1440px;height:900px;overflow:hidden;background:#f5f2ea;font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;color:#16150f}
  .slide{position:relative;width:1440px;height:900px;padding:72px 96px}
  .kicker{font-size:18px;letter-spacing:.34em;color:rgba(22,21,15,.55)}
  .kicker b{margin-left:18px;padding:4px 12px;border:1px solid #e0762e;border-radius:999px;color:#b85a1c;font-weight:500;letter-spacing:.12em;font-size:15px}
  h1{margin-top:34px;font-size:96px;font-weight:300;letter-spacing:-.035em;line-height:1.02}
  h1 small{display:block;font-size:36px;letter-spacing:-.01em;color:rgba(22,21,15,.55);margin-top:14px;font-weight:300}
  .cols{position:absolute;left:96px;right:96px;top:420px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr;align-items:stretch}
  .box{border:1px solid rgba(22,21,15,.16);border-radius:22px;padding:34px 36px;min-height:300px;background:#fff}
  .box h2{font-size:30px;font-weight:500;letter-spacing:-.02em}
  .bar{height:16px;border-radius:8px;background:rgba(22,21,15,.10);margin-top:22px}
  .bar.s{width:64%} .bar.m{width:82%} .bar.l{width:100%}
  .arrow{align-self:center;justify-self:center;width:28px;height:2px;background:#e0762e;position:relative}
  .arrow::after{content:"";position:absolute;right:-2px;top:-6px;border:7px solid transparent;border-left:10px solid #e0762e}
  .pg{position:absolute;right:96px;bottom:60px;font-size:20px;letter-spacing:.18em;color:rgba(22,21,15,.45)}
  .band{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(90deg,#e0762e,#e9dcc6)}
  .wm{position:absolute;left:96px;bottom:56px;font-size:16px;letter-spacing:.22em;color:rgba(22,21,15,.38)}
</style>
</head>
<body>
<div class="slide">
  <div class="kicker">UX WORKSHOP · 2026 <b>자리 표시</b></div>
  <h1>화면이 아니라<br>구조부터 정한다<small>실제 워크샵 자료가 들어올 자리 — 지금은 더미</small></h1>
  <div class="cols">
    <div class="box"><h2>문제</h2><div class="bar l"></div><div class="bar m"></div><div class="bar s"></div></div>
    <div class="arrow"></div>
    <div class="box"><h2>구조</h2><div class="bar m"></div><div class="bar l"></div><div class="bar s"></div></div>
    <div class="arrow"></div>
    <div class="box"><h2>화면</h2><div class="bar s"></div><div class="bar l"></div><div class="bar m"></div></div>
  </div>
  <div class="wm">PLACEHOLDER · 회색 바는 본문 자리</div>
  <div class="pg">07 / 24</div>
  <div class="band"></div>
</div>
</body>
</html>
