<body>
<div class="iframe_body">
   
    <div class="popup_setting_line">
        <div class="setting_line_oj">
            <span class="">메뉴</span>
        </div>
    </div>
    <div class="work_grid_wrap">
        <div class="workspace ">
            <div class="na_flex_row">
                <div class="table_style">
                    <div class="treey_container">
                        <ul id="treeCounsellingClassifier" class="ztree"></ul>
                    </div>
                </div>
                <div class="contour_col_type_2"></div>
                <div class="workspace_oj">
                    <div class="popup_function_line border_b_l">
                        <div class="popup_inline left_wrap">
                            <div class="oj_flex">
                                <div class="con_name">조회조건</div>
                                <div class="con_name">:</div>
                                <select id="searchCondition" class="input_style">
                                    <option value="">전체</option>
                                    <option value="userName">고객명</option>
                                    <option value="postProcTitle">제목</option>
                                    <option value="postProcContent">내용</option>
                                </select>
                                <input id="searchStr" class="input_style" placeholder="택스트 입력">
                            </div>
                            <div class="contour_col"></div>
                            <div class="oj_flex">
                                <div class="con_name">조회기간</div>
                                <div class="con_name">:</div>
                                <input id="searchStartDt" class="input_style" type="date">
                                <div class="con_name">~</div>
                                <input id="searchEndDt" class="input_style" type="date">
                                <select id="periodSelector" class="input_style">

                                    

                                    <option value="-1">선택</option>
                                    <option value="5">오늘</option>
                                    <option value="0">이번주</option>
                                    <option value="1">저번주</option>
                                    <option value="2">이번달</option>
                                    <option value="3">전달</option>
                                    <option value="4">올해</option>

                                </select>
                            </div>
                            <div class="contour_col"></div>
                            <div class="oj_flex">
                                <button id="searchBtn" class="menu_bu">조 회</button>
                                <input id="currCategLevel" type="hidden" value="0">
                                <input id="currCategId" type="hidden">
                            </div>
                            <div class="oj_flex">
                                <button id="resetBtn" class="menu_bu">초기화</button>
                            </div>
                        </div>
                    </div>
                    <div class="table_style margin_t_10">
                        <table id="cnslHistTable">
                            <tr class="table_title_line ">
                                <td>No.</td>
                                <td>그룹</td>
                                <td>고객명</td>
                                <td>고객 전화번호</td>
                                <td>상담시간</td>
                                <td>상담분류</td>
                                <td>상담내용</td>
                                <td>등록일시</td>
                                <td>상담유형</td>
                                
                            </tr>
                        </table>
                        <div class="pageing_wrap">

                        </div>
