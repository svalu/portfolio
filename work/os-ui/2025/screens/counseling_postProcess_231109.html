<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.7, maximum-scale=0.7, user-scalable=yes">
    <title>COUNSELING OS</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <script type="text/javascript" src="../vendor/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="../mock/mock-api.js"></script>
    <script type="text/javascript" src="../js/common/acs.js"></script>
    <script type="text/javascript" src="../js/common/commonPopup.js"></script> 
    <script type="text/javascript" src="../js/counseling/postProcess.js"></script> 
</head>

<body>
    <div class="iframe_body">
       <div class="popup_setting_line"></div>
        <div class="workspace">
        	
            <div class="work_line_2 border_t_l">
                <div class="oj_flex">
                    <div class="con_name">상담유형</div>
                    <div class="con_name">:</div>
                    <div class="con_name" id="postProcType">예약</div>
                </div>
            </div>
            <div class="work_line_2 border_t_l">
                <div class="oj_flex">
                    <div class="con_name">상담분류</div>
                    <div class="con_name">:</div>
                    <select class="input_style" id="cateMainId">
                        <option value="">대분류</option>
                    </select>
                    <select class="input_style" id="cateMiddleId">
                        <option value="">중분류</option>
                    </select>
                    <select class="input_style" id="cateSubId">
                        <option value="">소분류</option>
                    </select>
                </div>
            </div>
            <div class="work_line_2">
                <textarea class="textarea_style size_1" id="postProcTitle" name="postProcTitle" placeholder="제목을 입력해 주세요"></textarea>
            </div>
            <div class="work_line_2 margin_t_10">
                <textarea class="textarea_style " id="postProcContent" name="postProcContent" placeholder="내용을 입력해 주세요"></textarea>
            </div>
            <button class="menu_bu size_w_f margin_t_10 btnSave display_none">저 장</button>
        </div>
    </div>
</body>

</html>
