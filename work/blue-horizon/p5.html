<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Horizon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Noto Sans KR',sans-serif}
body{overflow:hidden;background:#0B1120}
#p5-bg{position:fixed;inset:0;z-index:0}
#p5-bg canvas{display:block}

/* ── SCROLLBAR ─────────────────────────── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}

/* ── GLASS VARS ────────────────────────── */
.app{
  --gb:   rgba(255,255,255,0.08);
  --gb2:  rgba(255,255,255,0.05);
  --gbdr: rgba(255,255,255,0.14);
  --gsh:  0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  --sbg:  rgba(11,17,32,0.82);
  --sbdr: rgba(255,255,255,0.10);
  --hbg:  rgba(11,17,32,0.72);
  --hbdr: rgba(255,255,255,0.10);
  --t1:rgba(255,255,255,0.92);--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.30);
  --ac:  #22d3ee;
  --acb: rgba(34,211,238,0.12);
  --nhv: rgba(255,255,255,0.06);
  --qbg: rgba(255,255,255,0.05);
  --qbd: rgba(255,255,255,0.10);
  --evs: rgba(255,255,255,0.06);
  --kbdr:rgba(255,255,255,0.18);
  --kc:  rgba(255,255,255,0.30);
  --tr:  background 0.4s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.4s ease;
}

/* ── APP SHELL ─────────────────────────── */
.app{display:flex;height:100vh;position:fixed;inset:0;z-index:1;animation:appin .5s ease both}
@keyframes appin{from{opacity:0}to{opacity:1}}

/* ── LOGIN ─────────────────────────────── */
.lc-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.lc-card{width:100%;max-width:400px;background:rgba(255,255,255,0.08);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,0.18);border-radius:22px;padding:40px 36px 32px;box-shadow:0 24px 64px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);animation:cardin .6s cubic-bezier(.22,1,.36,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.lc-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.lc-mark{color:rgba(255,255,255,0.90);animation:markpulse 3s ease-in-out infinite}
@keyframes markpulse{0%,100%{filter:drop-shadow(0 0 8px rgba(34,211,238,0.35))}50%{filter:drop-shadow(0 0 20px rgba(34,211,238,0.70)) drop-shadow(0 0 36px rgba(139,92,246,0.35))}}
.lc-title{font-size:20px;font-weight:700;color:rgba(255,255,255,0.94);letter-spacing:.01em}
.lc-sub{font-size:12px;color:rgba(255,255,255,0.42);letter-spacing:.01em}
.lc-badge-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.lc-badge{font-size:10.5px;font-weight:600;padding:3px 10px;background:linear-gradient(135deg,rgba(6,182,212,0.35),rgba(34,211,238,0.25));border:1px solid rgba(34,211,238,0.40);border-radius:6px;color:#67e8f9;letter-spacing:.04em}
.lc-form{display:flex;flex-direction:column;gap:12px}
.lc-fw{position:relative}
.lc-fi{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.28);pointer-events:none;font-size:14px;line-height:1}
.lc-f{width:100%;padding:12px 14px 12px 38px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:10px;font-family:inherit;font-size:13.5px;color:rgba(255,255,255,0.88);outline:none;transition:border-color .25s,background .25s,box-shadow .25s}
.lc-f::placeholder{color:rgba(255,255,255,0.28)}
.lc-f:focus{border-color:rgba(34,211,238,0.60);background:rgba(255,255,255,0.10);box-shadow:0 0 0 3px rgba(34,211,238,0.12)}
.lc-btn{width:100%;padding:13px;margin-top:4px;background:linear-gradient(135deg,#0891b2,#22d3ee);border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .25s;animation:btnglow 3s ease-in-out infinite}
.lc-btn:hover{transform:translateY(-1px)}
.lc-btn.loading{pointer-events:none;opacity:.85}
@keyframes btnglow{0%,100%{box-shadow:0 4px 18px rgba(8,145,178,0.45)}50%{box-shadow:0 6px 28px rgba(8,145,178,0.65)}}
.lc-btn::after{content:'';position:absolute;top:-50%;left:-75%;width:50%;height:200%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.26) 50%,transparent 60%);animation:btnsh 3s ease-in-out infinite;animation-delay:.8s}
@keyframes btnsh{0%{left:-75%}40%,100%{left:150%}}
.lc-div{display:flex;align-items:center;gap:12px;margin:4px 0}
.lc-dl{flex:1;height:1px;background:rgba(255,255,255,0.09)}
.lc-dt{font-size:11px;color:rgba(255,255,255,0.28);white-space:nowrap}
.lc-reg{width:100%;padding:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.13);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.50);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.lc-reg:hover{background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.22);color:rgba(255,255,255,0.78)}
.lc-note{margin-top:16px;text-align:center;font-size:11px;color:rgba(255,255,255,0.26);line-height:1.5}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SIDEBAR ───────────────────────────── */
.sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sbg);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border-right:1px solid var(--sbdr);overflow-y:auto;overflow-x:hidden;transition:var(--tr)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sbdr)}
.logo-text{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--t1)}
.sidebar-nav{flex:1;padding:10px 0}
.nav-sec-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:10px 18px 3px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;font-size:12.5px;color:var(--t2);cursor:pointer;transition:var(--tr);position:relative}
.nav-item:hover{background:var(--nhv);color:var(--t1)}
.nav-item.active{background:var(--acb);color:var(--ac);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--ac);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--ac)}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:.75}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--sbdr);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.avatar-name{font-size:12px;font-weight:600;color:var(--t1)}
.avatar-role{font-size:10px;color:var(--t3)}

/* ── HEADER ────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.header{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--hbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--hbdr);flex-shrink:0;transition:var(--tr)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--qbg);border:1px solid var(--qbd);border-radius:8px;padding:5px 11px;max-width:280px;flex:1}
.search-box input{background:none;border:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--t1);width:100%}
.search-box input::placeholder{color:var(--t3)}
.kbd{font-size:9.5px;padding:1px 5px;border:1px solid var(--kbdr);border-radius:4px;color:var(--kc);background:rgba(255,255,255,0.04);white-space:nowrap}
.h-spacer{flex:1}
.ai-btn{display:flex;align-items:center;gap:5px;padding:5px 13px;background:linear-gradient(135deg,rgba(124,58,237,0.30),rgba(14,165,233,0.26));border:1px solid rgba(139,92,246,0.48);border-radius:20px;font-size:11.5px;font-weight:500;color:var(--t1);cursor:pointer;font-family:inherit;transition:transform .2s;animation:aiglow 3s ease-in-out infinite}
.ai-btn:hover{transform:scale(1.04)}
@keyframes aiglow{0%,100%{box-shadow:0 0 8px rgba(124,58,237,0.28)}50%{box-shadow:0 0 18px rgba(124,58,237,0.55),0 0 30px rgba(14,165,233,0.28)}}
.ai-star{display:inline-block;animation:starspin 4s ease-in-out infinite;transform-origin:center}
@keyframes starspin{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(.78)}50%{transform:rotate(180deg) scale(1.22)}75%{transform:rotate(270deg) scale(.78)}100%{transform:rotate(360deg) scale(1)}}
.h-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qbg);border:1px solid var(--qbd);color:var(--t2);cursor:pointer;font-size:13px;transition:var(--tr)}
.h-time{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}

/* ── CONTENT ───────────────────────────── */
.content{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--gb);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--gbdr);border-radius:14px;box-shadow:var(--gsh);transition:var(--tr)}
.status-banner{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.25);border-radius:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.s-left{display:flex;align-items:center;gap:10px}
.s-dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:pglow 2s ease-in-out infinite;flex-shrink:0}
@keyframes pglow{0%,100%{box-shadow:0 0 8px #34d399}50%{box-shadow:0 0 20px #34d399}}
.s-title{font-size:13.5px;font-weight:600;color:#34d399}
.s-sub{font-size:11.5px;color:rgba(52,211,153,0.60)}
.s-services{display:flex;gap:18px}
.svc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.svc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.svc-dot.g{background:#34d399;box-shadow:0 0 6px #34d399}.svc-dot.a{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;overflow:hidden;cursor:default;transition:var(--tr),transform .2s}
.kpi::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 80% 10%,var(--glow) 0%,transparent 55%);pointer-events:none}
.kpi:hover{transform:translateY(-2px)}
.kpi-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-lbl{font-size:10.5px;color:var(--t3);margin-bottom:4px;letter-spacing:.02em}
.kpi-val{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:5px;color:var(--t1)}
.kpi-sub{font-size:11px;color:var(--t2)}
.kpi-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.trend{font-size:11.5px;font-weight:600}
.trend.r{color:#f87171}.trend.g{color:#34d399}.trend.n{color:var(--t3)}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.sec{padding:16px 18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px}
.cnt-badge{font-size:10px;background:rgba(248,113,113,.18);color:#f87171;padding:1px 7px;border-radius:9px;border:1px solid rgba(248,113,113,.28)}
.sec-link{font-size:11px;color:var(--ac);cursor:pointer;opacity:.8}
.al-list{display:flex;flex-direction:column;gap:6px}
.al{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:var(--tr);border-left:2px solid transparent}
.al:hover{background:rgba(255,255,255,0.04)}
.al.danger{border-left-color:#f87171;background:rgba(248,113,113,.07)}
.al.warning{border-left-color:#fbbf24;background:rgba(251,191,36,.05)}
.al.info{border-left-color:#60a5fa;background:rgba(96,165,250,.05)}
.al-badge{flex-shrink:0;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:1px;letter-spacing:.03em}
.al-badge.danger{background:rgba(248,113,113,.22);color:#f87171;border:1px solid rgba(248,113,113,.35)}
.al-badge.warning{background:rgba(251,191,36,.20);color:#fbbf24;border:1px solid rgba(251,191,36,.32)}
.al-badge.info{background:rgba(96,165,250,.18);color:#93c5fd;border:1px solid rgba(96,165,250,.28)}
.al-title{font-size:12px;font-weight:600;margin-bottom:2px;color:var(--t1)}
.al-desc{font-size:11px;color:var(--t2);line-height:1.4}
.al-time{font-size:10px;color:var(--t3);flex-shrink:0;white-space:nowrap}
.nc-list{display:flex;flex-direction:column;gap:6px}
.nc{display:flex;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:var(--tr)}
.nc:hover{background:rgba(255,255,255,0.04)}
.nc-badge{flex-shrink:0;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:1px;letter-spacing:.03em}
.nc-badge.r{background:rgba(248,113,113,.20);color:#f87171;border:1px solid rgba(248,113,113,.30)}
.nc-badge.a{background:rgba(251,191,36,.18);color:#fbbf24;border:1px solid rgba(251,191,36,.28)}
.nc-badge.g{background:var(--qbg);color:var(--t2);border:1px solid var(--qbd)}
.nc-title{font-size:12px;font-weight:500;margin-bottom:2px;color:var(--t1)}
.nc-meta{font-size:10px;color:var(--t3)}
.live-hd{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#f87171;letter-spacing:.06em}
.live-pulse{width:6px;height:6px;border-radius:50%;background:#f87171;animation:lpulse 1.2s ease-in-out infinite;flex-shrink:0}
@keyframes lpulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.55)}50%{box-shadow:0 0 0 5px rgba(248,113,113,0)}}
.ev-list{display:flex;flex-direction:column}
.ev{display:flex;align-items:baseline;gap:9px;padding:5px 0;border-bottom:1px solid var(--evs);font-size:12px}
.ev:last-child{border-bottom:none}
.ev-time{font-size:10.5px;color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0;width:56px}
.ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ev-text{color:var(--t2);line-height:1.4;flex:1}
.ev-text b{color:var(--t1);font-weight:500}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:15px 8px;border-radius:11px;background:var(--qbg);border:1px solid var(--qbd);cursor:pointer;transition:var(--tr),transform .2s;text-align:center}
.qa:hover{background:var(--gb2);border-color:var(--gbdr);transform:translateY(-1px)}
.qa-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.qa-lbl{font-size:11px;font-weight:500;color:var(--t2)}
.qa:hover .qa-lbl{color:var(--t1)}

/* ── AI MODE ───────────────────────────── */
.ai-sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sbg);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border-right:1px solid var(--sbdr);overflow:hidden;transition:var(--tr),width .35s cubic-bezier(.4,0,.2,1)}
.ai-sidebar.collapsed{width:0;border-right:none}
.sdb-logo{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 18px;border-bottom:1px solid var(--sbdr)}
.sdb-logo-inner{display:flex;align-items:center;gap:10px;cursor:pointer}
.sdb-collapse{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:var(--tr);flex-shrink:0}
.sdb-collapse:hover{background:var(--nhv);color:var(--t1)}
.sdb-actions{display:flex;flex-direction:column;gap:2px;padding:10px 10px 6px}
.sdb-action{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--tr);white-space:nowrap}
.sdb-action:hover{background:var(--nhv);color:var(--t1)}
.sdb-action.new-chat{background:linear-gradient(135deg,rgba(124,58,237,0.20),rgba(14,165,233,0.16));border:1px solid rgba(139,92,246,0.32);color:var(--t1)}
.sdb-section{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:10px 18px 3px;display:flex;align-items:center;justify-content:space-between;white-space:nowrap}
.sdb-hist{flex:1;overflow-y:auto;padding:0 8px}
.sdb-hist-empty{font-size:11.5px;color:var(--t3);text-align:center;padding:20px 12px;line-height:1.5}
.sdb-item{padding:8px 10px;border-radius:7px;cursor:pointer;transition:var(--tr);margin-bottom:2px}
.sdb-item:hover{background:var(--nhv)}
.sdb-item-title{font-size:11.5px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdb-item-meta{font-size:10px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdb-footer{padding:12px 18px;border-top:1px solid var(--sbdr);display:flex;align-items:center;gap:9px;font-size:12px;color:var(--t2);cursor:pointer;white-space:nowrap}
.sdb-footer:hover{color:var(--ac)}
.ai-header{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--hbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--hbdr);flex-shrink:0}
.h-toggle-sb{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qbg);border:1px solid var(--qbd);color:var(--t2);cursor:pointer;transition:var(--tr)}
.h-title{font-size:13px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px}
.h-title-star{color:var(--ac);font-size:14px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:28px}
.welcome-title{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;color:var(--t1);animation:slideup .4s ease both}
.welcome-star{font-size:28px;color:var(--ac);animation:starspin 4s ease-in-out infinite;display:inline-block;transform-origin:center;filter:drop-shadow(0 0 10px rgba(34,211,238,0.55))}
@keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.input-wrap{width:100%;max-width:640px;background:var(--gb);border:1px solid var(--gbdr);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--gsh);animation:slideup .45s .05s ease both;overflow:hidden}

/* ── HELPERS ──────────────────────── */
function evText(ev){
  const parts=ev.text.split(new RegExp('('+ev.bold.map(b=>b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')'));
  return parts.map((p,i)=>ev.bold.includes(p)?<b key={i}>{p}</b>:p);
}

/* ── LINE CHART ───────────────────── */
function LineChart(){
  const W=490,H=170,PL=28,PR=10,PT=8,PB=26,cw=W-PL-PR,ch=H-PT-PB,maxY=120,n=7;
  const xp=i=>PL+(i/(n-1))*cw, yp=v=>PT+ch-(v/maxY)*ch;
  const labels=['03-20','03-21','03-22','03-23','03-24','03-25','03-26'];
  const ds=[
    {color:'#a78bfa',data:[50,36,113,80,85,113,80]},
    {color:'#34d399',data:[40,36,85,65,75,100,65]},
    {color:'#f87171',data:[8,8,18,10,8,14,8]},
  ];
  function smooth(data){
    const pts=data.map((v,i)=>[xp(i),yp(v)]);
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){const cx=(pts[i-1][0]+pts[i][0])/2;d+=` C${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)},${cx.toFixed(1)} ${pts[i][1].toFixed(1)},${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;}
    return d;
  }
  function area(data){return `${smooth(data)} L${xp(n-1).toFixed(1)} ${yp(0).toFixed(1)} L${xp(0).toFixed(1)} ${yp(0).toFixed(1)} Z`;}
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
      <defs>{ds.map((d,i)=><linearGradient key={i} id={`pg${i}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={d.color} stopOpacity="0.25"/><stop offset="100%" stopColor={d.color} stopOpacity="0.01"/></linearGradient>)}</defs>
      {[0,20,40,60,80,100,120].map(v=><g key={v}><line x1={PL} y1={yp(v)} x2={W-PR} y2={yp(v)} stroke="rgba(255,255,255,0.07)" strokeWidth="1"/><text x={PL-4} y={yp(v)+3.5} textAnchor="end" fontSize="8.5" fill="rgba(255,255,255,0.35)">{v}</text></g>)}
      {labels.map((l,i)=><text key={i} x={xp(i)} y={H-4} textAnchor="middle" fontSize="8.5" fill="rgba(255,255,255,0.35)">{l}</text>)}
      {ds.map((d,i)=><path key={i} d={area(d.data)} fill={`url(#pg${i})`} stroke="none"/>)}
      {ds.map((d,i)=><path key={i} d={smooth(d.data)} fill="none" stroke={d.color} strokeWidth="2" strokeLinecap="round"/>)}
      {ds.map((d,i)=>d.data.map((v,j)=><circle key={`${i}-${j}`} cx={xp(j)} cy={yp(v)} r="3" fill="#0B1120" stroke={d.color} strokeWidth="1.8"/>))}
    </svg>
  );
}

function AIModeScreen({onNavigate}){
  const [input,setInput]=useState('');
  const [messages,setMessages]=useState([]);
  const [chatStarted,setChatStarted]=useState(false);
  const [thinking,setThinking]=useState(false);
  const [panelOpen,setPanelOpen]=useState(false);
  const [history,setHistory]=useState([]);
  const [sbOpen,setSbOpen]=useState(true);
  const scrollRef=useRef(null);
  const nowStr=()=>{const d=new Date();const h=d.getHours();return `${h<12?'오전':'오후'} ${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;};
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,thinking]);
  function isStat(q){return/통계|분석|추이|주간|일별|인바운드|포기율|응답률/.test(q);}
  function send(q){
    const text=(q||input).trim();if(!text)return;
    setInput('');setChatStarted(true);
    setMessages(p=>[...p,{role:'user',content:text,time:nowStr()}]);
    if(!history.length||history[0].title!==text)setHistory(p=>[{title:text,meta:`${TODAY} · 방금`},...p.slice(0,4)]);

    const show=isStat(text);

      setThinking(false);
      setMessages(p=>[...p,{role:'ai',content:show?'통계를 조회했습니다. 이번 주 총 인바운드는 578건이며, 일평균 83건 수준입니다. 03-25일에 113건으로 최대치를 기록했고, 포기율은 평균 17.8%로 전주 대비 소폭 상승했습니다.':'조회했습니다. 현재 시스템은 정상 운영 중이며 요청하신 정보를 확인했습니다. 추가로 궁금한 사항이 있으시면 질문해 주세요.',time:nowStr()}]);
      if(show)setPanelOpen(true);
    },900);

          <div className="sdb-collapse" onClick={()=>setSbOpen(v=>!v)}><I.back/></div>
        </div>
        <div className="sdb-actions">
          <div className="sdb-action new-chat" onClick={()=>{setMessages([]);setChatStarted(false);setPanelOpen(false);}}><I.pen/>새 대화</div>
        </div>
        <div className="sdb-section">대화 내역<I.trash/></div>
        <div className="sdb-hist">{history.length===0?<div className="sdb-hist-empty">대화 기록이 없습니다</div>:history.map((h,i)=><div className="sdb-item" key={i}><div className="sdb-item-title">{h.title}</div><div className="sdb-item-meta">{h.meta}</div></div>)}</div>
        <div className="sdb-footer"><I.back/>관리자 모드</div>
      </aside>
      <div className="main">
        <header className="ai-header">
          {!sbOpen&&<div className="h-toggle-sb" onClick={()=>setSbOpen(true)}><I.menu/></div>}
          <div className="h-title"><span className="h-title-star">✦</span>AI Mode</div>

        {!chatStarted?(
          <div className="welcome">
            <div className="welcome-title"><span className="welcome-star">✦</span>admin님, 무엇을 도와드릴까요?</div>
            <div className="input-wrap">

        )}

  );
}

/* ── APP ──────────────────────────── */
function App(){
  const [screen,setScreen]=useState('login');

  useEffect(()=>{
    const sketch=(p)=>{
      const nodes=[];
      p.setup=()=>{
        p.createCanvas(window.innerWidth,window.innerHeight);
        p.noStroke();
        for(let i=0;i<28;i++){
          nodes.push({
            x:p.random(p.width),y:p.random(p.height),
            vx:p.random(-0.28,0.28),vy:p.random(-0.28,0.28),
            r:p.random(2.5,5.5),
            active:i<5,
            pulse:p.random(0,Math.PI*2),
          });
        }
      };
      p.draw=()=>{
        p.background(11,17,32);
        for(let i=0;i<nodes.length;i++){
          for(let j=i+1;j<nodes.length;j++){
            const d=p.dist(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y);
            if(d<165){
              p.stroke(79,70,229,p.map(d,0,165,55,0));
              p.strokeWeight(0.55);
              p.line(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y);
            }
          }
        }
        p.noStroke();
        for(const n of nodes){
          n.x+=n.vx;n.y+=n.vy;n.pulse+=0.038;
          if(n.x<0||n.x>p.width)n.vx*=-1;
          if(n.y<0||n.y>p.height)n.vy*=-1;
          if(n.active){
            const g=2+Math.sin(n.pulse)*2.5;
            p.fill(99,102,241,18);p.circle(n.x,n.y,(n.r+g)*5.5);
            p.fill(139,92,246,55);p.circle(n.x,n.y,(n.r+g)*2.8);
            p.fill(167,139,250,215);p.circle(n.x,n.y,n.r*2);
          } else {
            p.fill(79,70,229,135);p.circle(n.x,n.y,n.r*2);
          }
        }
      };
      p.windowResized=()=>p.resizeCanvas(window.innerWidth,window.innerHeight);
    };
    const inst=new p5(sketch,document.getElementById('p5-bg'));
    return()=>inst.remove();
  },[]);

  return(
    <>
      {screen==='login'&&<LoginScreen onLogin={()=>setScreen('home')}/>}
      {screen==='home'&&<HomeScreen onNavigate={setScreen}/>}
      {screen==='aimode'&&<AIModeScreen onNavigate={setScreen}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
