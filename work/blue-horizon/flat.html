<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Horizon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Noto Sans KR',sans-serif}
body{overflow:hidden}

/* ── SHARED BACKGROUND ─────────────────────── */
.bg-wrap{position:fixed;inset:0;z-index:0}
.bg-layer{position:absolute;inset:0;transition:opacity 0.55s ease}
.bg-dark{background:#0F172A}
.bg-light{background:#F5F7FA}

/* ── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar,#CBD5E1);border-radius:2px}

/* ── APP VARS — LIGHT DEFAULT ──────────────── */
.app{
  --bg:#F5F7FA;
  --sidebar-bg:#FFFFFF; --sidebar-bdr:#E2E8F0;
  --header-bg:#FFFFFF;  --header-bdr:#E2E8F0;
  --search-bg:#F8FAFC;  --search-bdr:#E2E8F0;
  --t1:#0F172A; --t2:#64748B; --t3:#94A3B8;
  --nav-active-bg:#EEF2FF; --nav-active-c:#4F46E5;
  --nav-hover:#F8FAFC;
  --glass-bg:#FFFFFF; --glass-bg-2:#F8FAFC; --glass-border:#E2E8F0;
  --glass-shadow:0 1px 3px rgba(15,23,42,0.05), 0 4px 16px rgba(15,23,42,0.06);
  --qa-bg:#F8FAFC; --qa-bdr:#E2E8F0;
  --ev-sep:#F1F5F9; --al-hover:#F8FAFC; --nc-hover:#F8FAFC;
  --kbd-bdr:#E2E8F0; --kbd-c:#94A3B8; --scrollbar:#CBD5E1;
  --ai-bubble-bg:#FFFFFF; --user-bubble:#4F46E5;
  --ai-avatar-bg:#EEF2FF; --ai-avatar-bdr:#C7D2FE;
  --panel-bg:#F5F7FA; --chart-grid:#F1F5F9;
  --transition:background 0.45s ease, background-color 0.45s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.45s ease;
}
/* ── DARK MODE ─────────────────────────────── */
.app.dark-mode{
  --bg:#0F172A;
  --sidebar-bg:#1E293B; --sidebar-bdr:#2D3F57;
  --header-bg:#1E293B;  --header-bdr:#2D3F57;
  --search-bg:#253347;  --search-bdr:#334155;
  --t1:#F1F5F9; --t2:#94A3B8; --t3:#475569;
  --nav-active-bg:rgba(79,70,229,0.18); --nav-active-c:#818CF8;
  --nav-hover:rgba(255,255,255,0.04);
  --glass-bg:#1E293B; --glass-bg-2:#253347; --glass-border:#2D3F57;
  --glass-shadow:0 4px 6px rgba(0,0,0,0.25), 0 12px 32px rgba(0,0,0,0.28);
  --qa-bg:#253347; --qa-bdr:#2D3F57;
  --ev-sep:#1E3358; --al-hover:#253347; --nc-hover:#253347;
  --kbd-bdr:#334155; --kbd-c:#475569; --scrollbar:#334155;
  --ai-bubble-bg:#1E293B; --user-bubble:#4F46E5;
  --ai-avatar-bg:rgba(79,70,229,0.18); --ai-avatar-bdr:rgba(129,140,248,0.35);
  --panel-bg:#0F172A; --chart-grid:#2D3F57;
}

/* ── APP SHELL ─────────────────────────────── */
.app{display:flex;height:100vh;position:fixed;inset:0;z-index:1;animation:app-in .4s cubic-bezier(.22,1,.36,1) both}
@keyframes app-in{from{opacity:0}to{opacity:1}}

/* ── LOGIN CSS (lc- prefix) ────────────────── */
.lc-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);transition:background .5s ease}
.lc-theme-btn{position:fixed;top:18px;right:22px;display:flex;align-items:center;gap:7px;padding:5px 5px 5px 11px;background:var(--sidebar-bg);border:1px solid var(--sidebar-bdr);border-radius:20px;cursor:pointer;z-index:200;transition:var(--transition);user-select:none;box-shadow:0 1px 4px rgba(15,23,42,0.08)}
.lc-t-icon{font-size:12px;line-height:1}
.lc-t-label{font-size:11px;font-weight:500;color:var(--t2);transition:color .4s;white-space:nowrap}
.lc-pill{width:36px;height:20px;border-radius:10px;position:relative;flex-shrink:0;transition:background .4s}
.lc-pill.dark-on{background:#4F46E5}
.lc-pill.light-on{background:#E2E8F0}
.lc-knob{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);transition:left .35s cubic-bezier(.4,0,.2,1)}
.lc-knob.dark-on{left:3px}.lc-knob.light-on{left:19px}
.lc-card{width:100%;max-width:400px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:40px 36px 32px;box-shadow:var(--glass-shadow);animation:card-in .6s cubic-bezier(.22,1,.36,1) both;transition:var(--transition)}
@keyframes card-in{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:none}}
.lc-logo-area{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.lc-logo-mark{color:var(--nav-active-c);transition:color .4s}
.lc-logo-title{font-size:20px;font-weight:700;color:var(--t1);letter-spacing:.01em;transition:color .4s}
.lc-logo-sub{font-size:12px;color:var(--t2);letter-spacing:.01em;transition:color .4s}
.lc-instance-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.lc-instance-icon{color:var(--t3);font-size:13px}
.lc-instance-badge{font-size:10.5px;font-weight:600;padding:3px 10px;background:var(--nav-active-bg);border:1px solid #C7D2FE;border-radius:6px;color:var(--nav-active-c);letter-spacing:.04em;transition:var(--transition)}
.app.dark-mode .lc-instance-badge{border-color:#4338CA}
.lc-form{display:flex;flex-direction:column;gap:12px}
.lc-field-wrap{position:relative}
.lc-field-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none;font-size:14px;line-height:1;transition:color .35s}
.lc-field{width:100%;padding:12px 14px 12px 38px;background:var(--search-bg);border:1px solid var(--search-bdr);border-radius:10px;font-family:inherit;font-size:13.5px;color:var(--t1);outline:none;transition:var(--transition)}
.lc-field::placeholder{color:var(--t3)}
.lc-field:focus{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.lc-field-pw{letter-spacing:.1em}
.lc-btn{width:100%;padding:13px;margin-top:4px;background:#4F46E5;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;transition:background .18s, transform .18s, box-shadow .18s}
.lc-btn:hover{background:#4338CA;transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.4)}
.lc-btn.loading{pointer-events:none;opacity:.85}
.lc-divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.lc-div-line{flex:1;height:1px;background:var(--glass-border);transition:background .45s}
.lc-div-text{font-size:11px;color:var(--t3);white-space:nowrap;transition:color .4s}
.lc-register{width:100%;padding:12px;background:transparent;border:1px solid var(--glass-border);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--transition)}
.lc-register:hover{background:var(--qa-bg);border-color:var(--sidebar-bdr);color:var(--t1)}
.lc-note{margin-top:16px;text-align:center;font-size:11px;color:var(--t3);line-height:1.5;transition:color .4s}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SIDEBAR ───────────────────────────────── */
.sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-bdr);overflow-y:auto;overflow-x:hidden;transition:var(--transition)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sidebar-bdr);transition:border-color .35s}
.logo-text{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--t1);transition:color .35s}
.sidebar-nav{flex:1;padding:10px 0}
.nav-sec-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:10px 18px 3px;transition:color .35s}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;font-size:12.5px;color:var(--t2);cursor:pointer;transition:var(--transition);position:relative}
.nav-item:hover{background:var(--nav-hover);color:var(--t1)}
.nav-item.active{background:var(--nav-active-bg);color:var(--nav-active-c);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--nav-active-c);border-radius:0 2px 2px 0}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:.75}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--sidebar-bdr);display:flex;align-items:center;gap:9px;transition:border-color .35s}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.avatar-name{font-size:12px;font-weight:600;color:var(--t1);transition:color .35s}
.avatar-role{font-size:10px;color:var(--t3);transition:color .35s}

/* ── HEADER ────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.header{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--header-bg);border-bottom:1px solid var(--header-bdr);flex-shrink:0;transition:var(--transition)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--search-bg);border:1px solid var(--search-bdr);border-radius:8px;padding:5px 11px;max-width:280px;flex:1;transition:var(--transition)}
.search-box input{background:none;border:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--t1);width:100%;transition:color .35s}
.search-box input::placeholder{color:var(--t3)}
.kbd{font-size:9.5px;padding:1px 5px;border:1px solid var(--kbd-bdr);border-radius:4px;color:var(--kbd-c);background:var(--qa-bg);white-space:nowrap;transition:var(--transition)}
.h-spacer{flex:1}
.ai-btn{display:flex;align-items:center;gap:5px;padding:5px 13px;background:var(--nav-active-bg);border:1px solid rgba(79,70,229,.3);border-radius:20px;font-size:11.5px;font-weight:500;color:var(--nav-active-c);cursor:pointer;font-family:inherit;transition:var(--transition),transform .2s}
.ai-btn:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(79,70,229,.2)}
.ai-star{display:inline-block;animation:star-spin 4s ease-in-out infinite;transform-origin:center}
@keyframes star-spin{0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(90deg) scale(.78)}50%{transform:rotate(180deg) scale(1.22)}75%{transform:rotate(270deg) scale(.78)}100%{transform:rotate(360deg) scale(1)}}
.h-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qa-bg);border:1px solid var(--qa-bdr);color:var(--t2);cursor:pointer;font-size:13px;transition:var(--transition)}
.h-icon:hover{color:var(--t1)}
.h-time{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:58px;text-align:right;transition:color .35s}

/* ── THEME TOGGLE ──────────────────────────── */
.theme-toggle{display:flex;align-items:center;gap:7px;padding:4px 4px 4px 10px;background:var(--qa-bg);border:1px solid var(--qa-bdr);border-radius:20px;cursor:pointer;transition:var(--transition)}
.theme-label{font-size:11px;color:var(--t2);font-weight:500;transition:color .35s;white-space:nowrap}
.toggle-pill{width:36px;height:20px;border-radius:10px;position:relative;transition:background .4s;flex-shrink:0}
.toggle-pill.dark-on{background:#4F46E5}
.toggle-pill.light-on{background:#E2E8F0}
.toggle-knob{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.4,0,.2,1)}
.toggle-knob.dark-on{left:3px}.toggle-knob.light-on{left:19px}
.toggle-icon{font-size:11px;line-height:1}

/* ── HOME CONTENT ──────────────────────────── */
.content{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;background:var(--bg);transition:background .45s}
.glass{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;box-shadow:var(--glass-shadow);transition:var(--transition)}
.status-banner{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.25);border-radius:12px;transition:var(--transition)}
.app.dark-mode .status-banner{background:rgba(52,211,153,0.06);border-color:rgba(52,211,153,0.20)}
.s-left{display:flex;align-items:center;gap:10px}
.s-dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pglow 2s ease-in-out infinite;flex-shrink:0}
@keyframes pglow{0%,100%{box-shadow:0 0 6px #34d399}50%{box-shadow:0 0 16px #34d399}}
.s-title{font-size:13.5px;font-weight:600;color:#16a34a}
.app.dark-mode .s-title{color:#34d399}
.s-sub{font-size:11.5px;color:#22c55e;opacity:.7}
.s-services{display:flex;gap:18px}
.svc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);transition:color .35s}
.svc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.svc-dot.g{background:#34d399}.svc-dot.a{background:#fbbf24}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:default;transition:var(--transition),transform .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.10)}
.app.dark-mode .kpi:hover{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.kpi-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-lbl{font-size:10.5px;color:var(--t3);margin-bottom:4px;letter-spacing:.02em;transition:color .35s}
.kpi-val{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:5px;color:var(--t1);transition:color .35s}
.kpi-sub{font-size:11px;color:var(--t2);transition:color .35s}
.kpi-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.trend{font-size:11.5px;font-weight:600}
.trend.r{color:#f87171}.trend.g{color:#34d399}.trend.n{color:var(--t3)}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.sec{padding:16px 18px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px;transition:color .35s}
.cnt-badge{font-size:10px;background:rgba(248,113,113,.15);color:#f87171;padding:1px 7px;border-radius:9px;border:1px solid rgba(248,113,113,.25)}
.sec-link{font-size:11px;color:var(--nav-active-c);cursor:pointer;opacity:.8;transition:color .35s}
.al-list{display:flex;flex-direction:column;gap:6px}
.al{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:var(--transition);border-left:2px solid transparent}
.al:hover{background:var(--al-hover)}
.al.danger{border-left-color:#f87171;background:rgba(248,113,113,.06)}
.al.warning{border-left-color:#fbbf24;background:rgba(251,191,36,.05)}
.al.info{border-left-color:#60a5fa;background:rgba(96,165,250,.05)}
.al-badge{flex-shrink:0;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:1px;letter-spacing:.03em}
.al-badge.danger{background:rgba(248,113,113,.18);color:#f87171;border:1px solid rgba(248,113,113,.30)}
.al-badge.warning{background:rgba(251,191,36,.18);color:#d97706;border:1px solid rgba(251,191,36,.30)}
.app.dark-mode .al-badge.warning{color:#fbbf24}
.al-badge.info{background:rgba(96,165,250,.15);color:#3b82f6;border:1px solid rgba(96,165,250,.25)}
.app.dark-mode .al-badge.info{color:#93c5fd}
.al-title{font-size:12px;font-weight:600;margin-bottom:2px;color:var(--t1);transition:color .35s}
.al-desc{font-size:11px;color:var(--t2);line-height:1.4;transition:color .35s}
.al-time{font-size:10px;color:var(--t3);flex-shrink:0;white-space:nowrap;transition:color .35s}
.nc-list{display:flex;flex-direction:column;gap:6px}
.nc{display:flex;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:var(--transition)}
.nc:hover{background:var(--nc-hover)}
.nc-badge{flex-shrink:0;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:1px;letter-spacing:.03em}
.nc-badge.r{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.nc-badge.a{background:rgba(251,191,36,.15);color:#d97706;border:1px solid rgba(251,191,36,.25)}
.app.dark-mode .nc-badge.a{color:#fbbf24}
.nc-badge.g{background:var(--qa-bg);color:var(--t2);border:1px solid var(--qa-bdr)}
.nc-title{font-size:12px;font-weight:500;margin-bottom:2px;color:var(--t1);transition:color .35s}
.nc-meta{font-size:10px;color:var(--t3);transition:color .35s}
.live-hd{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:#f87171;letter-spacing:.06em}
.live-pulse{width:6px;height:6px;border-radius:50%;background:#f87171;animation:lpulse 1.2s ease-in-out infinite;flex-shrink:0}
@keyframes lpulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 4px rgba(248,113,113,0)}}
.ev-list{display:flex;flex-direction:column}
.ev{display:flex;align-items:baseline;gap:9px;padding:5px 0;border-bottom:1px solid var(--ev-sep);font-size:12px;transition:border-color .35s}
.ev:last-child{border-bottom:none}
.ev-time{font-size:10.5px;color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0;width:56px;transition:color .35s}
.ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ev-text{color:var(--t2);line-height:1.4;flex:1;transition:color .35s}
.ev-text b{color:var(--t1);font-weight:500}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:15px 8px;border-radius:11px;background:var(--qa-bg);border:1px solid var(--qa-bdr);cursor:pointer;transition:var(--transition),transform .2s;text-align:center}
.qa:hover{background:var(--glass-bg-2);transform:translateY(-1px);box-shadow:var(--glass-shadow)}
.qa-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.qa-lbl{font-size:11px;font-weight:500;color:var(--t2);transition:color .35s}
.qa:hover .qa-lbl{color:var(--t1)}

/* ── AI MODE — EXTRA ───────────────────────── */
.ai-sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-bdr);overflow:hidden;transition:var(--transition),width .35s cubic-bezier(.4,0,.2,1)}
.ai-sidebar.collapsed{width:0;border-right:none}
.sdb-logo{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 18px;border-bottom:1px solid var(--sidebar-bdr);transition:border-color .35s}
.sdb-logo-inner{display:flex;align-items:center;gap:10px;cursor:pointer}
.sdb-collapse{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:var(--transition);flex-shrink:0}
.sdb-collapse:hover{background:var(--nav-hover);color:var(--t1)}
.sdb-actions{display:flex;flex-direction:column;gap:2px;padding:10px 10px 6px}
.sdb-action{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--transition);white-space:nowrap}

function renderEvText(ev){

  return parts.map((p,i)=>ev.bold.includes(p)?<b key={i}>{p}</b>:p);
}

/* ── LINE CHART ─────────────────────────────── */
function LineChart({dark}){
  const W=490,H=170,PL=28,PR=10,PT=8,PB=26;
  const cw=W-PL-PR,ch=H-PT-PB,maxY=120,n=7;
  const xp=i=>PL+(i/(n-1))*cw;
  const yp=v=>PT+ch-(v/maxY)*ch;
  const labels=['03-20','03-21','03-22','03-23','03-24','03-25','03-26'];
  const datasets=[
    {color:dark?'#818CF8':'#6366f1',data:[50,36,113,80,85,113,80]},
    {color:dark?'#34d399':'#10B981',data:[40,36,85,65,75,100,65]},
    {color:dark?'#f87171':'#EF4444',data:[8,8,18,10,8,14,8]},
  ];
  const grid=dark?'#2D3F57':'#F1F5F9';
  const axis=dark?'#64748B':'#94A3B8';
  const dot=dark?'#1E293B':'#fff';
  function smooth(data){
    const pts=data.map((v,i)=>[xp(i),yp(v)]);
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){const cx=(pts[i-1][0]+pts[i][0])/2;d+=` C${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)},${cx.toFixed(1)} ${pts[i][1].toFixed(1)},${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;}
    return d;
  }
  function area(data){const last=xp(n-1),first=xp(0),base=yp(0);return `${smooth(data)} L${last.toFixed(1)} ${base.toFixed(1)} L${first.toFixed(1)} ${base.toFixed(1)} Z`;}
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
      <defs>{datasets.map((ds,i)=><linearGradient key={i} id={`fg${i}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={ds.color} stopOpacity={dark?"0.22":"0.12"}/><stop offset="100%" stopColor={ds.color} stopOpacity="0.01"/></linearGradient>)}</defs>
      {[0,20,40,60,80,100,120].map(v=><g key={v}><line x1={PL} y1={yp(v)} x2={W-PR} y2={yp(v)} stroke={grid} strokeWidth="1"/><text x={PL-4} y={yp(v)+3.5} textAnchor="end" fontSize="8.5" fill={axis}>{v}</text></g>)}
      {labels.map((l,i)=><text key={i} x={xp(i)} y={H-4} textAnchor="middle" fontSize="8.5" fill={axis}>{l}</text>)}
      {datasets.map((ds,i)=><path key={i} d={area(ds.data)} fill={`url(#fg${i})`} stroke="none"/>)}
      {datasets.map((ds,i)=><path key={i} d={smooth(ds.data)} fill="none" stroke={ds.color} strokeWidth="2" strokeLinecap="round"/>)}
      {datasets.map((ds,i)=>ds.data.map((v,j)=><circle key={`${i}-${j}`} cx={xp(j)} cy={yp(v)} r="3" fill={dot} stroke={ds.color} strokeWidth="1.8"/>))}
    </svg>
  );
}

function AIModeScreen({dark,onToggle,onNavigate}){
  const [input,setInput]=useState('');
  const [messages,setMessages]=useState([]);
  const [chatStarted,setChatStarted]=useState(false);
  const [thinking,setThinking]=useState(false);
  const [panelOpen,setPanelOpen]=useState(false);
  const [history,setHistory]=useState([]);
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const scrollRef=useRef(null);
  const now=()=>{const d=new Date();const h=d.getHours();return `${h<12?'오전':'오후'} ${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;};
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,thinking]);
  function isStatQuery(q){return/통계|분석|추이|주간|일별|인바운드|포기율|응답률/.test(q);}
  function handleSend(q){
    const text=(q||input).trim();if(!text)return;
    setInput('');setChatStarted(true);
    setMessages(prev=>[...prev,{role:'user',content:text,time:now()}]);
    if(!history.length||history[0].title!==text)setHistory(prev=>[{title:text,meta:`${TODAY} · 방금`},...prev.slice(0,4)]);
    setThinking(true);
    const show=isStatQuery(text);
    setTimeout(()=>{
      setThinking(false);
      setMessages(prev=>[...prev,{role:'ai',content:show?'통계를 조회했습니다. 이번 주 총 인바운드는 578건이며, 일평균 83건 수준입니다. 03-25일에 113건으로 최대치를 기록했고, 포기율은 평균 17.8%로 전주 대비 소폭 상승했습니다.':'조회했습니다. 현재 시스템은 정상 운영 중이며 요청하신 정보를 확인했습니다. 추가로 궁금한 사항이 있으시면 질문해 주세요.',time:now()}]);
      if(show)setPanelOpen(true);
    },900);
  }
  function handleKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}}
  return(
    <div className={'app'+(dark?' dark-mode':'')}>
      <aside className={'ai-sidebar'+(sidebarOpen?'':' collapsed')}>
        <div className="sdb-logo">
          <div className="sdb-logo-inner" onClick={()=>onNavigate('home')}>
            <svg viewBox="0 0 28 28" fill="none" width="20" height="20" style={{color:'#4F46E5'}}><path d="M14 3 L5 22 L23 22 Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><circle cx="14" cy="10" r="2.8" fill="currentColor"/></svg>
            <span className="logo-text">Blue Horizon</span>
          </div>
          <div className="sdb-collapse" onClick={()=>setSidebarOpen(v=>!v)}><I.back/></div>
        </div>
        <div className="sdb-actions">
          <div className="sdb-action" onClick={()=>{setMessages([]);setChatStarted(false);setPanelOpen(false);}}><I.pen/>새 대화</div>
        </div>
        <div className="sdb-section">대화 내역<I.trash/></div>
        <div className="sdb-hist">
          {history.length===0
            ?<div className="sdb-hist-empty">대화 기록이 없습니다</div>
            :history.map((h,i)=><div className="sdb-item" key={i}><div className="sdb-item-title">{h.title}</div><div className="sdb-item-meta">{h.meta}</div></div>)
          }
        </div>
        <div className="sdb-footer"><I.back/>관리자 모드</div>
      </aside>
      <div className="main">
        <header className="ai-header">
          {!sidebarOpen&&<div className="h-toggle-sb" onClick={()=>setSidebarOpen(true)}><I.menu/></div>}
          <div className="h-title"><span className="h-title-star">✦</span>AI Mode</div>
          <div className="h-spacer"/>
          <ThemeToggle dark={dark} onToggle={onToggle}/>
        </header>
        {!chatStarted?(
          <div className="welcome">
            <div className="welcome-title"><span className="welcome-star">✦</span>admin님, 무엇을 도와드릴까요?</div>
            <div className="input-wrap">
              <div className="input-inner">
                <textarea className="chat-input" placeholder="무엇이든 물어보세요" rows={1} value={input}
                  onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}}
                  onKeyDown={handleKeyDown}/>
                <button className="send-btn" onClick={()=>handleSend()}><I.up/></button>
              </div>
              <div className="input-hint"><span className="kbd">Ctrl+K</span><span>커맨드</span></div>
            </div>
            <div className="samples">
              {SAMPLES.map((s,i)=><div className="sample" key={i} onClick={()=>handleSend(s)}><span className="sample-dot">✦</span><span>{s}</span></div>)}
            </div>
          </div>
        ):(
          <div className="chat-layout">
            <div className="messages-col">
              <div className="messages-scroll" ref={scrollRef}>
                {messages.map((m,i)=>m.role==='user'?(
                  <div key={i}>
                    <div className="msg-user"><div className="msg-user-bubble">{m.content}</div><div className="msg-user-avatar">A</div></div>
                    <div className="msg-time">{m.time}</div>
                  </div>
                ):(
                  <div key={i}>
                    <div className="msg-ai"><div className="ai-avatar">✦</div><div className="msg-ai-card">{m.content}</div></div>
                    <div className="msg-ai-time" style={{paddingLeft:38}}>{m.time}</div>
                  </div>
                ))}
                {thinking&&<div className="msg-ai"><div className="ai-avatar">✦</div><div className="msg-ai-card"><div className="thinking"><div className="t-dot"/><div className="t-dot"/><div className="t-dot"/></div></div></div>}
              </div>
              <div className="chat-bottom">
                <div className="chat-input-row">
                  <textarea placeholder="무엇이든 물어보세요" rows={1} value={input}
                    onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}}
                    onKeyDown={handleKeyDown}/>
                  <button className="send-btn" onClick={()=>handleSend()}><I.up/></button>
                </div>
                <div className="chat-input-hint"><span className="kbd">Ctrl+K</span>&nbsp;커맨드</div>
              </div>
            </div>
            <StatsPanel open={panelOpen} onClose={()=>setPanelOpen(false)} dark={dark}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── APP ────────────────────────────────────── */
function App(){
  const [screen,setScreen]=useState('login');
  const [dark,setDark]=useState(false);
  return(
    <>
      <div className="bg-wrap">
        <div className="bg-layer bg-dark" style={{opacity:dark?1:0}}/>
        <div className="bg-layer bg-light" style={{opacity:dark?0:1}}/>
      </div>
      {screen==='login'&&<LoginScreen dark={dark} onToggle={()=>setDark(d=>!d)} onLogin={()=>setScreen('home')}/>}
      {screen==='home'&&<HomeScreen dark={dark} onToggle={()=>setDark(d=>!d)} onNavigate={setScreen}/>}
      {screen==='aimode'&&<AIModeScreen dark={dark} onToggle={()=>setDark(d=>!d)} onNavigate={setScreen}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
