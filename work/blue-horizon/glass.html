<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Horizon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Noto Sans KR',sans-serif}
body{overflow:hidden}

/* ── SHARED BACKGROUND ─────────────────────────── */
.bg-wrap{position:fixed;inset:0;z-index:0}
.bg-layer{position:absolute;inset:0;transition:opacity 0.65s ease}
.bg-dark{background:linear-gradient(140deg,#060618 0%,#0c0a28 35%,#1e0a3c 65%,#0a1630 100%)}
.bg-light{background:linear-gradient(140deg,#eef2ff 0%,#f5f0ff 40%,#e0f2fe 70%,#f0fdf4 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:orb-float 10s ease-in-out infinite;pointer-events:none;transition:opacity 0.65s ease}
.orb-a{width:680px;height:680px;top:-200px;right:-120px;animation-delay:0s}
.orb-b{width:520px;height:520px;bottom:-180px;left:-100px;animation-delay:-4s}
.orb-c{width:380px;height:380px;top:42%;right:30%;animation-delay:-7s}
.dark-orbs .orb-a{background:radial-gradient(circle,rgba(139,92,246,0.45) 0%,transparent 70%)}
.dark-orbs .orb-b{background:radial-gradient(circle,rgba(6,182,212,0.30) 0%,transparent 70%)}
.dark-orbs .orb-c{background:radial-gradient(circle,rgba(167,139,250,0.22) 0%,transparent 70%)}
.light-orbs .orb-a{background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,transparent 70%)}
.light-orbs .orb-b{background:radial-gradient(circle,rgba(6,182,212,0.16) 0%,transparent 70%)}
.light-orbs .orb-c{background:radial-gradient(circle,rgba(167,139,250,0.12) 0%,transparent 70%)}
@keyframes orb-float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18px,-20px) scale(1.04)}66%{transform:translate(-14px,16px) scale(0.97)}}

/* ── SCROLLBAR ─────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:2px}

/* ── SCREEN TRANSITIONS ─────────────────────────── */
@keyframes screen-in{from{opacity:0}to{opacity:1}}
@keyframes screen-out{from{opacity:1}to{opacity:0}}

/* ── APP CSS VARS — DARK ────────────────────────── */
.app{
  --glass-bg:      rgba(255,255,255,0.13);
  --glass-bg-2:    rgba(255,255,255,0.10);
  --glass-border:  rgba(255,255,255,0.22);
  --glass-shadow:  0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10);
  --sidebar-bg:    rgba(255,255,255,0.08);
  --sidebar-bdr:   rgba(255,255,255,0.12);
  --header-bg:     rgba(255,255,255,0.08);
  --header-bdr:    rgba(255,255,255,0.12);
  --search-bg:     rgba(255,255,255,0.09);
  --search-bdr:    rgba(255,255,255,0.14);
  --t1:rgba(255,255,255,0.93);--t2:rgba(255,255,255,0.58);--t3:rgba(255,255,255,0.33);
  --nav-active-bg: rgba(34,211,238,0.14);
  --nav-active-c:  #22d3ee;
  --nav-hover:     rgba(255,255,255,0.07);
  --qa-bg:         rgba(255,255,255,0.06);
  --qa-bdr:        rgba(255,255,255,0.11);
  --ev-sep:        rgba(255,255,255,0.06);
  --al-hover:      rgba(255,255,255,0.05);
  --nc-hover:      rgba(255,255,255,0.05);
  --kbd-bdr:       rgba(255,255,255,0.18);
  --kbd-c:         rgba(255,255,255,0.30);
  --scrollbar:     rgba(255,255,255,0.14);
  --input-bg:      rgba(255,255,255,0.08);
  --input-bdr:     rgba(255,255,255,0.14);
  --input-bg-2:    rgba(255,255,255,0.06);
  --chat-bottom-bg:rgba(255,255,255,0.04);
  --chart-grid:    rgba(255,255,255,0.06);
  --chart-text:    rgba(255,255,255,0.40);
  --chart-dot:     #0c0a28;
  --warm-bg:       linear-gradient(135deg,rgba(251,191,36,0.10),rgba(255,255,255,0.08));
  --warm-bdr:      rgba(251,191,36,0.25);
  --transition:    background 0.55s ease, background-color 0.55s ease, border-color 0.45s ease, color 0.4s ease, box-shadow 0.5s ease;
}
/* ── APP CSS VARS — LIGHT ─────────────────────── */
.app.light-mode{
  --glass-bg:      rgba(255,255,255,0.62);
  --glass-bg-2:    rgba(255,255,255,0.52);
  --glass-border:  rgba(100,116,139,0.16);
  --glass-shadow:  0 8px 32px rgba(100,116,139,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
  --sidebar-bg:    rgba(255,255,255,0.72);
  --sidebar-bdr:   rgba(100,116,139,0.14);
  --header-bg:     rgba(255,255,255,0.72);
  --header-bdr:    rgba(100,116,139,0.12);
  --search-bg:     rgba(255,255,255,0.70);
  --search-bdr:    rgba(100,116,139,0.18);
  --t1:rgba(15,23,42,0.92);--t2:rgba(71,85,105,0.80);--t3:rgba(100,116,139,0.60);
  --nav-active-bg: rgba(6,182,212,0.10);
  --nav-active-c:  #0891b2;
  --nav-hover:     rgba(0,0,0,0.04);
  --qa-bg:         rgba(255,255,255,0.55);
  --qa-bdr:        rgba(100,116,139,0.16);
  --ev-sep:        rgba(0,0,0,0.06);
  --al-hover:      rgba(0,0,0,0.03);
  --nc-hover:      rgba(0,0,0,0.03);
  --kbd-bdr:       rgba(0,0,0,0.16);
  --kbd-c:         rgba(100,116,139,0.70);
  --scrollbar:     rgba(0,0,0,0.14);
  --input-bg:      rgba(255,255,255,0.78);
  --input-bdr:     rgba(100,116,139,0.20);
  --input-bg-2:    rgba(255,255,255,0.55);
  --chat-bottom-bg:rgba(255,255,255,0.55);
  --chart-grid:    rgba(15,23,42,0.08);
  --chart-text:    rgba(71,85,105,0.70);
  --chart-dot:     #ffffff;
  --warm-bg:       linear-gradient(135deg,rgba(251,191,36,0.16),rgba(255,255,255,0.65));
  --warm-bdr:      rgba(245,158,11,0.28);
}

/* ── APP SHELL ─────────────────────────────────── */
.app{display:flex;height:100vh;position:fixed;inset:0;z-index:1;animation:screen-in .4s ease both}

/* ── LOGIN STYLES ──────────────────────────────── */
.login-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-theme-btn{position:fixed;top:18px;right:22px;display:flex;align-items:center;gap:7px;padding:5px 5px 5px 11px;background:rgba(255,255,255,0.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:20px;cursor:pointer;z-index:200;transition:background .4s ease,border-color .4s ease;user-select:none}
.app.light-mode .login-theme-btn{background:rgba(255,255,255,0.65);border-color:rgba(100,116,139,0.20)}
.lt-icon{font-size:12px;line-height:1}
.lt-label{font-size:11px;font-weight:500;color:rgba(255,255,255,0.70);transition:color .4s ease;white-space:nowrap}
.app.light-mode .lt-label{color:rgba(71,85,105,0.85)}
.lt-pill{width:36px;height:20px;border-radius:10px;position:relative;flex-shrink:0;transition:background .4s ease}
.lt-pill.dark-on{background:linear-gradient(90deg,#7c3aed,#0ea5e9)}
.lt-pill.light-on{background:linear-gradient(90deg,#f59e0b,#f97316)}
.lt-knob{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.30);transition:left .35s cubic-bezier(.4,0,.2,1)}
.lt-knob.dark-on{left:3px}.lt-knob.light-on{left:19px}
.login-card{width:100%;max-width:400px;background:rgba(255,255,255,0.10);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.20);border-radius:22px;padding:40px 36px 32px;box-shadow:0 24px 64px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.14);animation:card-in 0.6s cubic-bezier(.22,1,.36,1) both;transition:background .55s ease,border-color .45s ease,box-shadow .5s ease}
.app.light-mode .login-card{background:rgba(255,255,255,0.68);border-color:rgba(100,116,139,0.18);box-shadow:0 24px 64px rgba(100,116,139,0.18),inset 0 1px 0 rgba(255,255,255,0.9)}
@keyframes card-in{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo-area{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.login-logo-mark{color:rgba(255,255,255,0.92);animation:logo-pulse 3s ease-in-out infinite;transition:color .4s ease}
.app.light-mode .login-logo-mark{color:rgba(15,23,42,0.85)}
@keyframes logo-pulse{0%,100%{filter:drop-shadow(0 0 8px rgba(34,211,238,0.30))}50%{filter:drop-shadow(0 0 18px rgba(34,211,238,0.65)) drop-shadow(0 0 32px rgba(139,92,246,0.30))}}
.login-logo-title{font-size:20px;font-weight:700;color:rgba(255,255,255,0.95);letter-spacing:.01em;transition:color .4s ease}
.app.light-mode .login-logo-title{color:rgba(15,23,42,0.92)}
.login-logo-sub{font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:.01em;transition:color .4s ease}
.app.light-mode .login-logo-sub{color:rgba(71,85,105,0.75)}
.login-instance-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.login-instance-icon{color:rgba(255,255,255,0.35);font-size:13px;transition:color .4s ease}
.app.light-mode .login-instance-icon{color:rgba(71,85,105,0.55)}
.login-instance-badge{font-size:10.5px;font-weight:600;padding:3px 10px;background:linear-gradient(135deg,rgba(8,145,178,0.45),rgba(34,211,238,0.35));border:1px solid rgba(34,211,238,0.40);border-radius:6px;color:#67e8f9;letter-spacing:.04em}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-field-wrap{position:relative}
.login-field-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.30);pointer-events:none;font-size:14px;line-height:1;transition:color .4s ease}
.app.light-mode .login-field-icon{color:rgba(100,116,139,0.55)}
.login-field{width:100%;padding:12px 14px 12px 38px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:10px;font-family:inherit;font-size:13.5px;color:rgba(255,255,255,0.90);outline:none;transition:border-color .25s, background .25s, box-shadow .25s, color .4s}
.login-field::placeholder{color:rgba(255,255,255,0.30)}
.login-field:focus{border-color:rgba(34,211,238,0.60);background:rgba(255,255,255,0.12);box-shadow:0 0 0 3px rgba(34,211,238,0.12)}
.app.light-mode .login-field{background:rgba(255,255,255,0.80);border-color:rgba(100,116,139,0.22);color:rgba(15,23,42,0.90)}
.app.light-mode .login-field::placeholder{color:rgba(100,116,139,0.55)}
.app.light-mode .login-field:focus{border-color:rgba(8,145,178,0.60);background:rgba(255,255,255,0.95);box-shadow:0 0 0 3px rgba(8,145,178,0.10)}
.login-field-pw{letter-spacing:.1em}
.login-btn{width:100%;padding:13px;margin-top:4px;background:linear-gradient(135deg,#0891b2,#22d3ee);border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s, box-shadow .25s;animation:btn-glow 3s ease-in-out infinite}
.login-btn:hover{transform:translateY(-1px)}
.login-btn.loading{pointer-events:none;opacity:.85}
@keyframes btn-glow{0%,100%{box-shadow:0 4px 18px rgba(8,145,178,0.45)}50%{box-shadow:0 6px 28px rgba(8,145,178,0.65)}}
.login-btn::after{content:'';position:absolute;top:-50%;left:-75%;width:50%;height:200%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.28) 50%,transparent 60%);animation:btn-shimmer 3s ease-in-out infinite;animation-delay:.8s}
@keyframes btn-shimmer{0%{left:-75%}40%,100%{left:150%}}
.login-divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.login-div-line{flex:1;height:1px;background:rgba(255,255,255,0.10);transition:background .45s}
.app.light-mode .login-div-line{background:rgba(0,0,0,0.10)}
.login-div-text{font-size:11px;color:rgba(255,255,255,0.30);white-space:nowrap;transition:color .4s}
.app.light-mode .login-div-text{color:rgba(100,116,139,0.60)}
.login-register-btn{width:100%;padding:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.55);cursor:pointer;transition:background .2s, color .2s, border-color .2s}
.login-register-btn:hover{background:rgba(255,255,255,0.11);border-color:rgba(255,255,255,0.22);color:rgba(255,255,255,0.80)}
.app.light-mode .login-register-btn{background:rgba(255,255,255,0.60);border-color:rgba(100,116,139,0.22);color:rgba(71,85,105,0.80)}
.login-note{margin-top:16px;text-align:center;font-size:11px;color:rgba(255,255,255,0.28);line-height:1.5;transition:color .4s}
.app.light-mode .login-note{color:rgba(100,116,139,0.60)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HOME — SIDEBAR ────────────────────────────── */
.sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sidebar-bg);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-right:1px solid var(--sidebar-bdr);overflow-y:auto;overflow-x:hidden;transition:var(--transition)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--sidebar-bdr);transition:border-color 0.45s ease}
.logo-text{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--t1);transition:color 0.4s ease}
.sidebar-nav{flex:1;padding:10px 0}
.nav-sec-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:10px 18px 3px;transition:color 0.4s ease}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;font-size:12.5px;color:var(--t2);cursor:pointer;transition:var(--transition);position:relative}
.nav-item:hover{background:var(--nav-hover);color:var(--t1)}
.nav-item.active{background:var(--nav-active-bg);color:var(--nav-active-c);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--nav-active-c);border-radius:0 2px 2px 0;box-shadow:0 0 8px var(--nav-active-c)}
.nav-icon{width:15px;height:15px;flex-shrink:0;opacity:.75}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--sidebar-bdr);display:flex;align-items:center;gap:9px;transition:border-color 0.45s ease}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.avatar-name{font-size:12px;font-weight:600;color:var(--t1);transition:color 0.4s ease}
.avatar-role{font-size:10px;color:var(--t3);transition:color 0.4s ease}

/* ── HOME — HEADER ─────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.header{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--header-bdr);flex-shrink:0;transition:var(--transition)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--search-bg);border:1px solid var(--search-bdr);border-radius:8px;padding:5px 11px;max-width:280px;flex:1;transition:var(--transition)}
.search-box input{background:none;border:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--t1);width:100%;transition:color 0.4s ease}
.search-box input::placeholder{color:var(--t3)}
.kbd{font-size:9.5px;padding:1px 6px;border:1px solid var(--kbd-bdr);border-radius:4px;color:var(--kbd-c);background:rgba(255,255,255,0.04);white-space:nowrap;transition:var(--transition)}
.h-spacer{flex:1}
.ai-btn{display:flex;align-items:center;gap:5px;padding:5px 13px;background:linear-gradient(135deg,rgba(124,58,237,0.32),rgba(14,165,233,0.28));border:1px solid rgba(139,92,246,0.50);border-radius:20px;font-size:11.5px;font-weight:500;color:var(--t1);cursor:pointer;font-family:inherit;letter-spacing:.01em;transition:color 0.4s ease, transform 0.2s ease;position:relative;overflow:hidden;animation:ai-glow 3s ease-in-out infinite}
.ai-btn:hover{transform:scale(1.04)}
@keyframes ai-glow{0%,100%{box-shadow:0 0 8px rgba(124,58,237,0.30)}50%{box-shadow:0 0 16px rgba(124,58,237,0.55),0 0 28px rgba(14,165,233,0.30)}}
.ai-star{display:inline-block;animation:ai-spin 4s ease-in-out infinite;transform-origin:center}
@keyframes ai-spin{0%{transform:rotate(0deg) scale(1);opacity:1}25%{transform:rotate(90deg) scale(0.75);opacity:0.65}50%{transform:rotate(180deg) scale(1.25);opacity:1}75%{transform:rotate(270deg) scale(0.75);opacity:0.65}100%{transform:rotate(360deg) scale(1);opacity:1}}
.h-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qa-bg);border:1px solid var(--qa-bdr);color:var(--t2);cursor:pointer;font-size:13px;transition:var(--transition)}
.h-time{font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:58px;text-align:right;transition:color 0.4s ease}
.theme-toggle{display:flex;align-items:center;gap:7px;padding:4px 4px 4px 10px;background:var(--qa-bg);border:1px solid var(--qa-bdr);border-radius:20px;cursor:pointer;transition:var(--transition)}
.theme-label{font-size:11px;color:var(--t2);font-weight:500;transition:color 0.4s ease;white-space:nowrap}
.toggle-pill{width:36px;height:20px;border-radius:10px;position:relative;transition:background 0.4s ease;flex-shrink:0}
.toggle-pill.dark-on{background:linear-gradient(90deg,#7c3aed,#0ea5e9)}
.toggle-pill.light-on{background:linear-gradient(90deg,#f59e0b,#f97316)}
.toggle-knob{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);transition:left 0.35s cubic-bezier(.4,0,.2,1)}
.toggle-knob.dark-on{left:3px}.toggle-knob.light-on{left:19px}
.toggle-icon{font-size:11px;line-height:1}

/* ── HOME — CONTENT ────────────────────────────── */
.content{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:14px;box-shadow:var(--glass-shadow);transition:var(--transition)}
.status-banner{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:rgba(52,211,153,0.09);border:1px solid rgba(52,211,153,0.28);border-radius:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:var(--transition)}
.app.light-mode .status-banner{background:rgba(16,185,129,0.07);border-color:rgba(5,150,105,0.25)}
.s-left{display:flex;align-items:center;gap:10px}
.s-dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:pglow 2s ease-in-out infinite;flex-shrink:0}
@keyframes pglow{0%,100%{box-shadow:0 0 8px #34d399}50%{box-shadow:0 0 20px #34d399,0 0 32px rgba(52,211,153,0.3)}}
.s-title{font-size:13.5px;font-weight:600;color:#34d399}
.app.light-mode .s-title{color:#059669}
.s-sub{font-size:11.5px;color:rgba(52,211,153,0.65)}

function renderEventText(ev) {
  const parts = ev.text.split(new RegExp('(' + ev.bold.map(b=>b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')'));
  return parts.map((p,i) => ev.bold.includes(p) ? <b key={i}>{p}</b> : p);
}

/* ── LINE CHART ────────────────────────────────── */
function LineChart(){
  const W=490,H=170,PL=28,PR=10,PT=8,PB=26;
  const cw=W-PL-PR,ch=H-PT-PB;
  const labels=['03-20','03-21','03-22','03-23','03-24','03-25','03-26'];
  const datasets=[
    {label:'인바운드',color:'#a78bfa',data:[50,36,113,80,85,113,80]},
    {label:'처리',color:'#34d399',data:[40,36,85,65,75,100,65]},
    {label:'포기',color:'#f87171',data:[8,8,18,10,8,14,8]},
  ];
  const maxY=120,n=labels.length;
  const xp=i=>PL+(i/(n-1))*cw;
  const yp=v=>PT+ch-(v/maxY)*ch;
  function smooth(data){
    const pts=data.map((v,i)=>[xp(i),yp(v)]);
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){const cx=(pts[i-1][0]+pts[i][0])/2;d+=` C${cx.toFixed(1)} ${pts[i-1][1].toFixed(1)},${cx.toFixed(1)} ${pts[i][1].toFixed(1)},${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;}
    return d;
  }
  function area(data){const last=xp(data.length-1),first=xp(0),base=yp(0);return `${smooth(data)} L${last.toFixed(1)} ${base.toFixed(1)} L${first.toFixed(1)} ${base.toFixed(1)} Z`;}
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
      <defs>{datasets.map((ds,i)=><linearGradient key={i} id={`cg${i}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={ds.color} stopOpacity="0.28"/><stop offset="100%" stopColor={ds.color} stopOpacity="0.01"/></linearGradient>)}</defs>
      {[0,20,40,60,80,100,120].map(v=><g key={v}><line className="chart-grid-line" x1={PL} y1={yp(v)} x2={W-PR} y2={yp(v)} strokeWidth="1"/><text className="chart-axis-text" x={PL-4} y={yp(v)+3.5} textAnchor="end" fontSize="8.5">{v}</text></g>)}
      {labels.map((l,i)=><text className="chart-axis-text" key={i} x={xp(i)} y={H-4} textAnchor="middle" fontSize="8.5">{l}</text>)}
      {datasets.map((ds,i)=><path key={i} d={area(ds.data)} fill={`url(#cg${i})`} stroke="none"/>)}
      {datasets.map((ds,i)=><path key={i} d={smooth(ds.data)} fill="none" stroke={ds.color} strokeWidth="2" strokeLinecap="round"/>)}
      {datasets.map((ds,i)=>ds.data.map((v,j)=><circle className="chart-dot" key={`${i}-${j}`} cx={xp(j)} cy={yp(v)} r="3" stroke={ds.color} strokeWidth="1.8"/>))}
    </svg>
  );
}

              {loading?<><span className="spinner"/>로그인 중...</>:'로그인'}
            </button>
            <div className="login-divider"><div className="login-div-line"/><span className="login-div-text">또는</span><div className="login-div-line"/></div>
            <button className="login-register-btn">회원가입</button>
          </div>
          <div className="login-note">처음 이용하시는 분은 회원가입 후 관리자 승인이 필요합니다.</div>
        </div>
      </div>
    </div>
  );
}

/* ── AI MODE SCREEN ────────────────────────────── */
function AIModeScreen({dark,onToggle,onNavigate}){
  const [input,setInput]=useState('');
  const [messages,setMessages]=useState([]);
  const [chatStarted,setChatStarted]=useState(false);
  const [thinking,setThinking]=useState(false);
  const [panelOpen,setPanelOpen]=useState(false);
  const [history,setHistory]=useState([]);
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const scrollRef=useRef(null);
  const now=()=>{const d=new Date();const h=d.getHours();const pre=h<12?'오전':'오후';return `${pre} ${h%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;};
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,thinking]);
  function isStatQuery(q){return/통계|분석|추이|주간|일별|인바운드|포기율|응답률/.test(q);}
  function handleSend(q){
    const text=(q||input).trim();if(!text)return;
    setInput('');setChatStarted(true);
    const userMsg={role:'user',content:text,time:now()};
    setMessages(prev=>[...prev,userMsg]);
    if(history.length===0||history[0].title!==text)setHistory(prev=>[{title:text,meta:`${TODAY} · 방금`},...prev.slice(0,4)]);
    setThinking(true);
    const showPanel=isStatQuery(text);
    setTimeout(()=>{
      setThinking(false);
      const reply=showPanel?'통계를 조회했습니다. 이번 주 총 인바운드는 578건이며, 일평균 83건 수준입니다. 03-25일에 113건으로 최대치를 기록했고, 포기율은 평균 17.8%로 전주 대비 소폭 상승했습니다.':'조회했습니다. 현재 시스템은 정상 운영 중이며 요청하신 정보를 확인했습니다. 추가로 궁금한 사항이 있으시면 질문해 주세요.';
      setMessages(prev=>[...prev,{role:'ai',content:reply,time:now()}]);
      if(showPanel)setPanelOpen(true);
    },900);
  }
  function handleKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}}
  return(
    <div className={'app'+(dark?'':' light-mode')}>
      {/* AI Sidebar */}
      <div className={'ai-sidebar'+(sidebarOpen?'':' collapsed')}>
        <div className="sdb-logo">
          <div className="sdb-logo-inner" onClick={()=>onNavigate('home')}>
            <svg viewBox="0 0 28 28" fill="none" width="20" height="20" style={{color:'#22d3ee'}}><path d="M14 3 L5 22 L23 22 Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><circle cx="14" cy="10" r="2.8" fill="currentColor"/></svg>
            <span className="sdb-logo-text">Blue Horizon</span>
          </div>
          <div className="sdb-collapse" onClick={()=>setSidebarOpen(v=>!v)}>
            <I.back/>
          </div>
        </div>
        <div className="sdb-actions">
          <div className="sdb-action new-chat" onClick={()=>{setMessages([]);setChatStarted(false);setPanelOpen(false);}}>
            <I.pen/>새 대화
          </div>
        </div>
        <div className="sdb-section">대화 내역<I.trash/></div>
        <div className="sdb-hist">
          {history.length===0
            ?<div className="sdb-hist-empty">대화 기록이 없습니다</div>
            :history.map((h,i)=><div className="sdb-item" key={i}><div className="sdb-item-title">{h.title}</div><div className="sdb-item-meta">{h.meta}</div></div>)
          }
        </div>
        <div className="sdb-footer"><I.back/>관리자 모드</div>
      </div>
      {/* Main */}
      <div className="main">
        <div className="main-topbar">
          <ThemeToggle dark={dark} onToggle={onToggle}/>
        </div>
        {!chatStarted?(
          <div className="welcome">
            <div className="welcome-title"><span className="welcome-star">✦</span>admin님, 무엇을 도와드릴까요?</div>
            <div className="input-wrap">
              <div className="input-inner">
                <textarea className="chat-input" placeholder="무엇이든 물어보세요" rows={1} value={input}
                  onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}}
                  onKeyDown={handleKeyDown}/>
                <button className="send-btn" onClick={()=>handleSend()}><I.up/></button>
              </div>
              <div className="input-hint"><span className="kbd">Ctrl+K</span><span>커맨드</span></div>
            </div>
            <div className="samples">
              {SAMPLES.map((s,i)=><div className="sample" key={i} onClick={()=>handleSend(s)}><span className="sample-dot">✦</span><span>{s}</span></div>)}
            </div>
          </div>
        ):(
          <div className="chat-layout">
            <div className="messages-col">
              <div className="messages-scroll" ref={scrollRef}>
                {messages.map((m,i)=>m.role==='user'?(
                  <div key={i}>
                    <div className="msg-user"><div className="msg-user-bubble">{m.content}</div><div className="msg-user-avatar">A</div></div>
                    <div className="msg-time">{m.time}</div>
                  </div>
                ):(
                  <div key={i}>
                    <div className="msg-ai"><div className="ai-avatar">✦</div><div className="msg-ai-card">{m.content}</div></div>
                    <div className="msg-ai-time" style={{paddingLeft:38}}>{m.time}</div>
                  </div>
                ))}
                {thinking&&<div className="msg-ai"><div className="ai-avatar">✦</div><div className="msg-ai-card"><div className="thinking"><div className="t-dot"/><div className="t-dot"/><div className="t-dot"/></div></div></div>}
              </div>
              <div className="chat-bottom">
                <div className="chat-input-row">
                  <textarea placeholder="무엇이든 물어보세요" rows={1} value={input}
                    onChange={e=>{setInput(e.target.value);e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}}
                    onKeyDown={handleKeyDown}/>
                  <button className="send-btn" onClick={()=>handleSend()}><I.up/></button>
                </div>
                <div className="chat-input-hint"><span className="kbd">Ctrl+K</span><span>커맨드</span></div>
              </div>
            </div>
            <StatsPanel open={panelOpen} onClose={()=>setPanelOpen(false)}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── APP ───────────────────────────────────────── */

  const [dark,setDark]=useState(true);
  const navigate=target=>setScreen(target);
  const toggleDark=()=>setDark(d=>!d);
  return(
    <>
      {/* Shared background — always rendered */}
      <div className="bg-wrap">
        <div className="bg-layer bg-dark" style={{opacity:dark?1:0}}/>
        <div className="bg-layer bg-light" style={{opacity:dark?0:1}}/>
        <div style={{position:'absolute',inset:0,opacity:dark?1:0,transition:'opacity 0.65s ease',pointerEvents:'none'}}>
          <div className="dark-orbs" style={{position:'absolute',inset:0}}>
            <div className="orb orb-a"/><div className="orb orb-b"/><div className="orb orb-c"/>
          </div>
        </div>
        <div style={{position:'absolute',inset:0,opacity:dark?0:1,transition:'opacity 0.65s ease',pointerEvents:'none'}}>
          <div className="light-orbs" style={{position:'absolute',inset:0}}>
            <div className="orb orb-a"/><div className="orb orb-b"/><div className="orb orb-c"/>
          </div>
        </div>
        <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px)',backgroundSize:'32px 32px',opacity:dark?0.6:0.3,transition:'opacity 0.55s ease',pointerEvents:'none'}}/>
      </div>
      {/* Screens */}
      {screen==='login'&&<LoginScreen dark={dark} onToggle={toggleDark} onLogin={()=>navigate('home')}/>}
      {screen==='home'&&<HomeScreen dark={dark} onToggle={toggleDark} onNavigate={navigate}/>}
      {screen==='aimode'&&<AIModeScreen dark={dark} onToggle={toggleDark} onNavigate={navigate}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
